# Every place this project talks to. A connection is a place with credentials; an entity is a
# thing in that place; the direction is the function you call -- source() to read, sink() to write.
raw:
  connector: localfiles
  # An entity's read options live here OR at the source() call that reads it -- never both, and
  # never merged. `customers` and `orders` are declared here because more than one pipeline could
  # want them on the same terms; `products` is declared at its call site in product_catalog.sql,
  # where the only pipeline reading it lives. Both spellings compile to the same node.
  entities:
    customers:
      read:
        path: data/customers.csv
        format: csv
        columns:
          id: bigint
          email: varchar
    orders:
      read:
        path: data/orders.csv
        format: csv
        columns:
          id: bigint
          customer_id: bigint
          amount: double
          status: varchar
    # Incremental: events_log.sql bounds its read by the stored watermark on updated_at. The watermark
    # lives on the platform (state routes), not in the workspace, so it survives a scale to zero.
    delta_orders:
      read:
        path: data/delta_orders.csv
        format: csv
        columns:
          id: bigint
          dt: varchar
          placed_at: timestamp
          amount: double
    events:
      read:
        path: data/events.csv
        format: csv
        columns:
          order_id: bigint
          customer_id: bigint
          amount: double
          status: varchar
          updated_at: timestamp
    # Backfill in slices: each run loads at most 3 ids past the watermark and the backfill is done at
    # id 10, so it takes four runs. PipelineX's "Repeat until caught up" queues them one after another.
    backfill_orders:
      read:
        path: data/backfill_orders.csv
        format: csv
        columns:
          id: bigint
          customer_id: bigint
          amount: double
          placed_at: timestamp
        sync:
          mode: incremental
          cursor: id
          max_window: "3"
          initial: "0"
          until: "10"
    # Keep a source current in windows: two days per run from 1 October up to the time the run started
    # (UTC). A nightly trigger with "Repeat until caught up" catches up however far behind it fell.
    window_events:
      read:
        path: data/window_events.csv
        format: csv
        columns:
          event_id: bigint
          order_id: bigint
          status: varchar
          updated_at: timestamp
        sync:
          mode: incremental
          cursor: updated_at
          max_window: "2d"
          initial: "2026-10-01T00:00:00"
          until: now

# A Delta lake on the machine that runs the pipeline. The root must be absolute (PZDL0101); /tmp is
# writable for the non-root user of the hosted agent image.
delta:
  connector: deltalake
  root: /tmp/px-delta

lake:
  connector: localfiles
  # Where this lake is. Every write lands under it in a directory named after the entity, so
  # `order_totals` becomes out/order_totals/. A `path:` kwarg on a sink() call overrides that for
  # one entity; an absolute path ignores `root:` entirely.
  root: out
